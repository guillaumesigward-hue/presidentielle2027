name: Mise a jour quotidienne

on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: veille-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      revision: ${{ steps.commit.outputs.revision }}

    steps:
      - name: Recuperer le site
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verifier Python et les garanties editoriales
        # Les PDF sont lus avant publication, jamais dans le navigateur.
        # La dépendance est épinglée pour garder une extraction reproductible.
        run: python -m pip install -r requirements.txt

      - name: Tester les extracteurs
        run: python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verifier l interface
        run: node tests/interface.cjs

      - name: Mettre en cache le modele de resume
        uses: actions/cache@v4
        with:
          path: .cache-modeles
          key: qwen-resumes-989aa798-v1

      - name: Installer le moteur de resume sans cle API
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-resumes.txt

      - name: Executer la mise a jour
        env:
          RESUMES_LOCAUX: '1'
          HF_HOME: ${{ github.workspace }}/.cache-modeles
        run: python update.py


      - name: Enregistrer la mise a jour
        id: commit
        run: |
          git config user.name "presidentielle2027-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/election.json data/programmes.json data/status.json data/actualites_detectees.json data/a_valider.json data/publications_auto.json
          if git diff --cached --quiet; then
            echo "Aucune modification a enregistrer."
          else
            git commit -m "Mise a jour quotidienne automatique"
            git push
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  actualiser_site:
    needs: update
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/publication.yml
    with:
      revision: ${{ needs.update.outputs.revision }}
