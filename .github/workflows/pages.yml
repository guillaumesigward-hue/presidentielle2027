name: Mise a jour quotidienne

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: veille-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    outputs:
      revision: ${{ steps.commit.outputs.revision }}

    steps:
      - name: Recuperer le site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Une exécution en attente doit partir des données du passage précédent.
          ref: main

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verifier Python et les garanties editoriales
        # Les PDF sont lus avant publication, jamais dans le navigateur.
        # La dépendance est épinglée pour garder une extraction reproductible.
        run: python -m pip install -r requirements.txt

      - name: Tester les extracteurs
        run: python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verifier l interface
        run: node tests/interface.cjs

      - name: Reserver l espace du moteur CPU
        run: |
          available=$(df --output=avail -k . | tail -1)
          if [ "$available" -lt 24000000 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android
          fi
          df -h .

      - name: Mettre en cache le modele de resume
        id: cache
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .cache-modeles/gguf14
          key: qwen14b-gguf-b466e1f8-b11541-v1

      - name: Preparer le moteur de resume sans cle API
        id: moteur
        continue-on-error: true
        timeout-minutes: 15
        run: python preparer_resumes.py

      - name: Executer la mise a jour
        timeout-minutes: 70
        env:
          RESUMES_LOCAUX: ${{ steps.moteur.outcome == 'success' && '1' || '0' }}
        run: python update.py

      - name: Valider et enregistrer la mise a jour
        id: commit
        timeout-minutes: 5
        run: python enregistrer_veille.py

      - name: Conserver le modele verifie
        timeout-minutes: 5
        if: always() && steps.moteur.outcome == 'success' && steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .cache-modeles/gguf14
          key: qwen14b-gguf-b466e1f8-b11541-v1

      - name: Conserver le diagnostic de veille
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-veille
          path: |
            data/status.json
            data/publications_auto.json
            .cache-modeles/gguf14/moteur.log
          retention-days: 7

  actualiser_site:
    needs: update
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/publication.yml
    with:
      revision: ${{ needs.update.outputs.revision }}

