name: Mise a jour quotidienne

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le site
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Executer la mise a jour
        run: python update.py

      - name: Enregistrer la mise a jour
        run: |
          git config user.name "presidentielle2027-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Aucune modification a enregistrer."
          else
            git commit -m "Mise a jour quotidienne automatique"
            git push
          fi
