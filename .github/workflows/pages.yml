name: Mise à jour quotidienne

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le site
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
              - name: Vérifier les sources
        shell: bash
        run: |
          SCRIPT=$(find . -maxdepth 1 -type f -name "*.py" -print -quit)
          echo "Script trouvé : $SCRIPT"
          test -n "$SCRIPT"
          python "$SCRIPT"
         
      - name: Enregistrer les changements
        run: |
          git config user.name "presidentielle2027-bot"
          git config user.email "actions@users.noreply.github.com"
          git add status.json
          if git diff --cached --quiet; then
            echo "Aucune modification à enregistrer."
          else
            git commit -m "Mise à jour quotidienne automatique"
            git push
          fi
