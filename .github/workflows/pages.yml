name: Mise a jour quotidienne

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veille-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Recuperer le site
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verifier Python et les garanties editoriales
        run: python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verifier l interface
        run: node tests/interface.cjs

      - name: Executer la mise a jour
        run: python update.py

      - name: Enregistrer la mise a jour
        run: |
          git config user.name "presidentielle2027-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/election.json data/status.json data/actualites_detectees.json data/a_valider.json
          if git diff --cached --quiet; then
            echo "Aucune modification a enregistrer."
          else
            git commit -m "Mise a jour quotidienne automatique"
            git push
          fi
