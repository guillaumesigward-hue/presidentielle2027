name: Publication manuelle validee
on:
  workflow_dispatch:
    inputs:
      validation_utilisateur:
        description: 'Je valide la publication de cette version sur GitHub Pages'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publication:
    if: github.ref == 'refs/heads/main' && inputs.validation_utilisateur == true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m unittest discover -s tests -v
      - run: node tests/interface.cjs
      - name: Preparer les seuls fichiers publics
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/election.json data/programmes.json _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publier la version validee
        id: deployment
        uses: actions/deploy-pages@v4
